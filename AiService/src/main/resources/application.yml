spring:
  application:
    name: AiService

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8105

logging:
  level:
    dev.langchain4j.mcp: ERROR

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY}
      streaming-chat-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY}
      embedding-model:
        model-name: text-embedding-v4
        api-key: ${DASHSCOPE_API_KEY}

bigmodel:
  mcp:
    enabled: ${BIGMODEL_MCP_ENABLED:false}
  api-key: ${BIGMODEL_API_KEY:}

rag:
  load-on-startup: ${RAG_LOAD_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
